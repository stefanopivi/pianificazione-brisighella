<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filiale di Brisighella – Pianificazione</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1f2a33; --muted:#5f6b75; --line:#dfdcd4;
  --accent:#1f5f6b; --accent-2:#c8693c; --ok:#2f7d4f; --warn:#b7791f; --ko:#b03a2e;
  --soft:#eef3f3; --soft-2:#f8efe9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--ink);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.2px}
header .sub{font-size:13px;opacity:.75}
header .sp{flex:1}
header button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
nav{display:flex;gap:4px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:12px 14px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--accent-2);font-weight:600}
nav button:disabled{opacity:.4;cursor:not-allowed}
main{max-width:1180px;margin:0 auto;padding:22px 24px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px}
h2{font-size:20px;margin:0 0 10px}
h3{font-size:16px;margin:16px 0 8px}
p{margin:6px 0 10px}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],textarea,input[type=password]{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;background:#fff}
textarea{min-height:56px;resize:vertical}
.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn.warm{background:var(--accent-2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;background:#faf9f6}
td.l,th.l{text-align:left}
tr.main td{font-weight:600}
tr.sub td.l{padding-left:22px;color:var(--muted)}
.neg{color:var(--ko)} .pos{color:var(--ok)}
.tbl-wrap{overflow-x:auto}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-start}
.chip{border:1px solid var(--line);background:#fff;border-radius:14px;min-width:28px;padding:2px 8px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.good{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.bad{background:var(--ko);border-color:var(--ko);color:#fff}
.chip.miss{border:2px dashed var(--ok);color:var(--ok)}
.bar{height:8px;background:#ece9e1;border-radius:4px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent)}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;letter-spacing:.3px}
.tag.T{background:var(--soft);color:var(--accent)} .tag.C{background:var(--soft-2);color:var(--accent-2)}
.person{display:flex;gap:12px;align-items:flex-start}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.alloc td{vertical-align:middle}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.stepper button{border:0;background:#f3f1ec;width:28px;height:30px;cursor:pointer;font-size:16px}
.stepper input{width:44px;border:0;text-align:center;font:inherit;font-weight:600;height:30px}
input[type=range]{width:130px;accent-color:var(--accent);display:block;margin:6px 0 0}
.gg{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.tot{font-weight:700}
.tot.ok{color:var(--ok)} .tot.ko{color:var(--ko)}
.score-big{font-size:54px;font-weight:700;line-height:1;color:var(--accent)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi .card{margin:0}
.kpi .v{font-size:26px;font-weight:700}
.fb{border-left:4px solid var(--line);padding:6px 12px;margin:8px 0;background:#fcfbf8;border-radius:0 6px 6px 0}
.fb.ok{border-color:var(--ok)} .fb.warn{border-color:var(--warn)} .fb.ko{border-color:var(--ko)}
.note{background:var(--soft);border-radius:8px;padding:10px 14px;font-size:14px}
.lock{background:var(--soft-2);border-radius:8px;padding:12px 14px}
.hide{display:none!important}
.modal{position:fixed;inset:0;background:rgba(20,28,34,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .card{max-width:680px;width:100%;max-height:90vh;overflow:auto}
.small{font-size:13px}
@media print{
  header button,nav,.noprint{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid;border-color:#ccc}
  .pg{display:block!important}
}
details.guide{background:#eef3f3;border-radius:8px;padding:8px 14px;margin:0 0 14px}
details.guide summary{cursor:pointer;font-weight:700;color:#1f5f6b}
details.guide ol{padding-left:20px;margin:6px 0}details.guide li{margin:5px 0;font-size:14px}
details.guide h4{margin:12px 0 4px;font-size:14px}
.pw{display:inline-block;background:#1f2a33;color:#fff;border-radius:4px;padding:1px 8px;font-family:monospace;font-size:14px}
details.guide p{font-size:14px;margin:6px 0}
.picked{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.pk{font-size:12px;background:var(--soft);color:var(--accent);border-radius:12px;padding:2px 8px;white-space:nowrap}
.btn.sm{padding:4px 10px;font-size:12px}
.pickrow{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--ink);font-size:14px;margin:0}
.pickrow:hover{background:#faf9f6}.pickrow input{margin-top:4px;transform:scale(1.2)}
.chart{width:100%;height:auto;display:block}
.lgd{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin:4px 0 6px}
.lgd i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.lgd em{font-style:normal;color:var(--muted);font-size:11px}
.tc-grid{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:20px;align-items:center;margin:10px 0}
@media(max-width:760px){.tc-grid{grid-template-columns:1fr}}
.tc-pies{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.donut{width:200px;height:200px}
.mini{display:grid;grid-template-columns:1fr 90px 40px;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
.mini b{color:var(--ink);text-align:right}
details.why summary{cursor:pointer;font-weight:600;color:var(--accent);margin-top:8px}
@media print{.team-card{break-before:page}}
</style>
</head>
<body>
<header>
  <div>
    <h1>La filiale di Brisighella · Pianificazione degli addetti titoli</h1>
    <div class="sub" id="hdrTeam">Esercitazione di team · Stra-Le Management Lab</div>
  </div>
  <div class="sp"></div>
  <button onclick="window.print()" class="noprint">Stampa / PDF</button>
  <button onclick="openTrainer()" class="noprint">Formatore</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div class="modal hide" id="modal"><div class="card" id="modalBody"></div></div>

<script>
/* ---------------- DATI DEL CASO ---------------- */
const KPI=[
 {id:'rd', l:'Raccolta diretta', s:36455096, t:40100606, a:38351111, main:1, eur:1, nomap:1, tot:1},
 {id:'rdv',l:'di cui: a vista', s:21508506, t:22912027, a:22100333, sub:1, eur:1},
 {id:'rds',l:'di cui: a scadenza', s:14946590, t:17188579, a:16250778, sub:1, eur:1},
 {id:'ri', l:'Raccolta indiretta', s:34997755, t:36047688, a:31676502, main:1, eur:1, nomap:1, tot:1},
 {id:'rg', l:'Raccolta gestita', s:25198384, t:null, a:23848961, eur:1, nomap:1, tot:1},
 {id:'fc', l:'di cui: fondi comuni', s:9827370, t:null, a:8432189, sub:1, eur:1},
 {id:'pp', l:'di cui: prodotti previdenziali', s:503967, t:null, a:853897, sub:1, eur:1},
 {id:'gp', l:'di cui: gestioni patrimoniali', s:11591257, t:null, a:9837221, sub:1, eur:1},
 {id:'pv', l:'di cui: polizze vita', s:3275790, t:null, a:4725654, sub:1, eur:1},
 {id:'ra', l:'Raccolta amministrata', s:9799372, t:null, a:7827541, eur:1},
 {id:'imp',l:'Impieghi', s:35652201, t:36000000, a:null, main:1, eur:1, nomap:1},
 {id:'cli',l:'N° clienti', s:1738, t:1790, a:1750, main:1},
 {id:'cc', l:'N° conti correnti', s:1508, t:1659, a:1520, main:1},
 {id:'car',l:'N° carte (credito + debito)', s:1883, t:2165, a:1920, main:1},
 {id:'hb', l:'N° contratti home banking', s:497, t:596, a:520, main:1},
 {id:'ps', l:'Nuove polizze sanitarie', s:0, t:50, a:10, main:1, flow:1},
 {id:'pxy',l:'Nuove polizze vita XY', s:0, t:80, a:20, main:1, flow:1},
 {id:'nfp',l:'Nuovi fondi pensione', s:0, t:null, a:12, main:1, flow:1},
];
const ACT=[
 {c:'A', l:'Apertura nuovi conti correnti', ty:'C'},
 {c:'B', l:'Vendita obbligazioni della Banca su clienti esistenti', ty:'C'},
 {c:'C', l:'Vendita obbligazioni della Banca su clienti nuovi (nominativi tratti da liste)', ty:'C'},
 {c:'D', l:'Offrire fondi pensione a tutti i clienti lavoratori autonomi di età oltre i 40 anni (15% del totale clienti)', ty:'T'},
 {c:'E', l:'Collocare 100 nuove polizze vita della XY ai clienti della filiale', ty:'C'},
 {c:'F', l:'Rivedere profilatura e asset allocation dei primi 150 clienti ed eventualmente proporre soluzioni più coerenti', ty:'T'},
 {c:'G', l:'Vendere 50 polizze di assicurazione sanitaria', ty:'C'},
 {c:'H', l:'Presentare la nuova piattaforma di trading online ai clienti con home banking e raccolta amministrata', ty:'T'},
];
const CODES=ACT.map(a=>a.c);
const DAYS=80, DM=Math.round(DAYS*.3), DL=Math.round(DAYS*.5); // 24 e 40 giorni

/* chiave del collegamento KPI -> attività: core = attese, ok = accettate */
const MAPKEY={
 rdv:{core:['A'],ok:['C']}, rds:{core:['C','B'],ok:['F']},
 fc:{core:['F'],ok:[]},
 pp:{core:['D'],ok:['F']}, gp:{core:['F'],ok:[]}, pv:{core:['E'],ok:['F']}, ra:{core:['H'],ok:['F']},
 cli:{core:['A','C'],ok:[]}, cc:{core:['A'],ok:['C']}, car:{core:['A'],ok:['C']}, hb:{core:['A','H'],ok:['C']},
 ps:{core:['G'],ok:['A']}, pxy:{core:['E'],ok:['F']}, nfp:{core:['D'],ok:[]}
};

/* ---------------- MODELLO DI PUNTEGGIO ---------------- */
// V = peso del gap che l'attività attacca; need = giorni "efficaci" che servono; fM/fL = efficacia di Mario/Luigi
const M={
 A:{V:4,  need:14, fM:.35, fL:1},
 B:{V:1,  need:6,  fM:.5,  fL:.8},
 C:{V:4,  need:14, fM:.3,  fL:1},
 D:{V:3,  need:8,  fM:1,   fL:.5},
 E:{V:2.5,need:10, fM:.6,  fL:.9},
 F:{V:5,  need:22, fM:1,   fL:.1},
 G:{V:2,  need:8,  fM:.3,  fL:1},
 H:{V:3,  need:7,  fM:1,   fL:.4},
};
function contrib(c,m,l){const p=M[c];const e=p.fM*DM*m/100+p.fL*DL*l/100;return p.V*(1-Math.exp(-e/p.need))}
function val(mA,lA){return CODES.reduce((s,c)=>s+contrib(c,mA[c]||0,lA[c]||0),0)}
const Z=()=>Object.fromEntries(CODES.map(c=>[c,0]));
function optimum(){
  const m=Z(),l=Z(); m.F=100; l.A=100; let imp=true;
  while(imp){imp=false;for(const d of [m,l])for(const a of CODES)for(const b of CODES){
    if(a!==b&&d[a]>=5){const v0=val(m,l);d[a]-=5;d[b]+=5;if(val(m,l)>v0+1e-9)imp=true;else{d[a]+=5;d[b]-=5}}}}
  return {m,l};
}
const OPT=optimum(), VO=val(OPT.m,OPT.l);
let VW=Infinity; for(const a of CODES)for(const b of CODES){const v=val({...Z(),[a]:100},{...Z(),[b]:100});if(v<VW)VW=v}
function score(m,l){const x=Math.max(0,Math.min(1,(val(m,l)-VW)/(VO-VW)));return Math.round(100*Math.pow(x,1.5))}
function fitIdx(m,l){ // % del tempo coerente con il profilo
  let mt=0,lc=0;ACT.forEach(a=>{if(a.ty==='T')mt+=m[a.c]||0;else lc+=l[a.c]||0});return {mt,lc,avg:Math.round((mt+lc)/2)}
}

/* soluzioni di riferimento */
const SOL_O={name:'Soluzione ottimale',
 m:{A:0,B:0,C:0,D:30,E:0,F:40,G:0,H:30}, l:{A:30,B:5,C:30,D:0,E:20,F:0,G:15,H:0}};
const WHY={
 A:"<b>Luigi 30% (12 giorni).</b> È il gap più ampio in quantità: conti a 1.520 contro 1.659 (−139; a fine agosto siamo all'8% del percorso, contro il 67% atteso). Ogni conto si vende a pacchetto con carta (−245) e home banking (−76), porta nuovi clienti (−40) e raccolta a vista (−0,81 mln). È l'attività che muove più indicatori insieme. Obiettivo per Luigi: circa 35 conti al mese.",
 B:"<b>Luigi 5% (2 giorni), Mario 0.</b> Poco tempo e mirato: solo clienti con liquidità presso altre banche o titoli in scadenza. Sui clienti esistenti l'obbligazione sposta denaro dalla raccolta a vista a quella a scadenza senza far crescere la diretta, e con tassi ai minimi il prodotto è poco attraente.",
 C:"<b>Luigi 30% (12 giorni).</b> È l'unica attività che porta denaro nuovo alla raccolta diretta (−1,75 mln sul budget, di cui −0,94 sulla scadenza) insieme a nuovi clienti e nuovi conti. Lavoro da venditore puro su liste di nominativi: obiettivo settimanale di appuntamenti e contratti, il modo in cui Luigi rende di più.",
 D:"<b>Mario 30% (7 giorni).</b> La previdenza è la voce che cresce di più (+69%, 12 nuovi fondi): conviene spingere dove il mercato risponde. Ha una scadenza naturale, la deducibilità dei versamenti entro il 31/12. I circa 260 autonomi over 40 richiedono consulenza: è lavoro di Mario. Luigi non ha tempo dedicato, ma segnala i clienti adatti che incontra aprendo conti (A) e vendendo obbligazioni (C).",
 E:"<b>Luigi 20% (8 giorni), Mario 0.</b> Mancano 60 polizze XY su 80: è un gap commerciale su un prodotto standard, circa 15 polizze al mese con un obiettivo preciso. Le polizze vita crescono già in valore (+44% sullo stock), quindi non servono giorni dedicati di Mario: le propone dentro le revisioni F quando emerge un bisogno.",
 F:"<b>Mario 40% (circa 10 giorni).</b> È la leva sul gap più grande in valore: raccolta indiretta −4,37 mln (−12% sull'obiettivo), gestioni −15%, fondi −14%. Prende la quota più grande del tempo di Mario, ma 150 revisioni non stanno in 10 giorni: si scelgono i 30-35 clienti con il patrimonio maggiore (regola 80/20). Oltre il 40% il tempo in più rende meno di quello speso su D e H. Non si delega a Luigi: profilatura e adeguatezza richiedono competenza di consulenza e hanno vincoli normativi.",
 G:"<b>Luigi 15% (6 giorni).</b> Mancano 40 polizze su 50: alto in percentuale ma basso in valore. Si vende soprattutto in abbinamento all'apertura dei nuovi conti (A), dove il contatto c'è già. Obiettivo: circa 10 al mese.",
 H:"<b>Mario 30% (7 giorni).</b> La raccolta amministrata è il calo percentuale più forte della filiale (−1,97 mln, −20%). Presentare una piattaforma di trading è un'attività tecnica, quindi di Mario. Si può fare anche in piccoli gruppi o in un evento serale: molti clienti con poco tempo. Con la ripresa dei mercati è il momento giusto per riattivarli.",
};

/* ---------------- STATO ---------------- */
const KEY='strale_brisighella_v1';
let S=load()||{team:'',classe:'',membri:'',map:{},showDelta:false,m:Z(),l:Z(),why:{},note:'',submitted:false,submittedAt:null,tab:0,unlocked:false};
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------------- UTILITY ---------------- */
const fmt=n=>n==null?'—':Math.round(n).toLocaleString('it-IT');
const pct=(x,d=1)=>x==null||!isFinite(x)?'—':(x*100).toLocaleString('it-IT',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const sg=(n,f)=>n==null?'—':`<span class="${n<0?'neg':'pos'}">${n>0?'+':''}${f(n)}</span>`;
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

/* ---------------- NAVIGAZIONE ---------------- */
const TABS=['1 · Il caso','2 · Analisi dei gap','3 · Pianificazione','4 · Risultati','5 · Soluzione'];
function renderNav(){
  $('nav').innerHTML=TABS.map((t,i)=>{
    const dis=(i===3&&!S.submitted)||(i===4&&!S.unlocked);
    return `<button class="${S.tab===i?'on':''}" ${dis?'disabled':''} onclick="go(${i})">${t}${i===4&&!S.unlocked?' 🔒':''}</button>`}).join('');
  $('hdrTeam').textContent=S.team?`Team: ${S.team}${S.classe?' · '+S.classe:''}`:'Esercitazione di team · Stra-Le Management Lab';
}
function go(i){S.tab=i;save();render();window.scrollTo(0,0)}
function render(){renderNav();[tabCaso,tabGap,tabPlan,tabRis,tabSol][S.tab]()}

/* ---------------- TAB 1 ---------------- */
function tabCaso(){
  $('main').innerHTML=`
  <div class="card">
    <h2>Il vostro team</h2>
    <div class="grid2">
      <div><label>Nome del team</label><input type="text" id="team" value="${esc(S.team)}" oninput="S.team=this.value;save();renderNav()"></div>
      <div><label>Classe / edizione</label><input type="text" id="classe" value="${esc(S.classe)}" placeholder="es. BCC Vallo – Classe 1" oninput="S.classe=this.value;save();renderNav()"></div>
    </div>
    <div style="margin-top:10px"><label>Componenti</label><input type="text" value="${esc(S.membri)}" oninput="S.membri=this.value;save()"></div>
  </div>
  <div class="card">
    <h2>La situazione</h2>
    <p>Siete il direttore della filiale di Brisighella, una filiale medio-piccola. È fine agosto. A inizio anno avete condiviso con il vostro capo gli obiettivi della filiale; l'anno è il più difficile dagli anni '70.</p>
    <p><b>Scenario.</b> A fine maggio la discesa delle borse si è arrestata e s'intravedono segnali di ripresa, pur con forte volatilità. Gli investitori stanno lentamente recuperando fiducia. La stretta sul credito sembra superata ed è tornata un po' di liquidità nel sistema. I tassi sono ai minimi storici e non sono previsti rialzi significativi nel breve termine.</p>
    <p><b>Le attività</b> decise a inizio anno sono già avviate e non si possono cambiare: potete solo dedicare più o meno risorse a ciascuna.</p>
    <div class="tbl-wrap"><table><tr><th class="l">Cod.</th><th class="l">Attività</th><th class="l">Tipo attività</th></tr>
    ${ACT.map(a=>`<tr><td class="l"><b>${a.c}</b></td><td class="l">${a.l}</td><td class="l"><span class="tag ${a.ty}">${a.ty==='T'?'Tecnica':'Commerciale'}</span></td></tr>`).join('')}</table></div>
  </div>
  <div class="card">
    <h2>Le persone</h2>
    <p class="muted">Organico: direttore (voi), vice direttore (prevalentemente fidi), un assistente alla clientela (spesso in cassa), un addetto fidi e due addetti titoli.</p>
    <div class="grid2">
      <div class="person"><div class="avatar" style="background:var(--accent)">M</div><div><b>Mario, 36 anni</b> – l'esperto finanza della filiale. Laureato in economia, ha il patentino di promotore e l'anno scorso ha frequentato un corso EFPA.<br><span class="muted small">Tempo pianificabile: 30% → <b>${DM} giorni</b> fino a fine anno</span></div></div>
      <div class="person"><div class="avatar" style="background:var(--accent-2)">L</div><div><b>Luigi, 29 anni</b> – ragioniere, ha la vendita nel sangue: basta dirgli cosa fare (obiettivo preciso) ed è capace di vendere un frigorifero agli eschimesi.<br><span class="muted small">Tempo pianificabile: 50% → <b>${DL} giorni</b> fino a fine anno</span></div></div>
    </div>
  </div>
  <div class="card note">

function mapScore(){
  let tot=0,max=0;const rows=[];
  for(const k of KPI){if(k.nomap)continue;const key=MAPKEY[k.id],sel=S.map[k.id]||[];
    const hit=key.core.filter(c=>sel.includes(c)).length, wrong=sel.filter(c=>!key.core.includes(c)&&!key.ok.includes(c)).length;
    const s=Math.max(0,hit/key.core.length-.25*wrong);tot+=s;max+=1;rows.push({k,sel,key,s})}
  return {pct:Math.round(100*tot/max),rows};
}
function feedback(m,l){
  const F=[];const add=(t,c)=>F.push({t,c});
  if((l.F||0)>0)add(`Luigi su F (${l.F}%): la revisione di profilatura e asset allocation è un'attività di consulenza con vincoli di adeguatezza. Non è il suo mestiere: il tempo rende poco.`, 'ko');
  if((m.F||0)<30)add(`${(m.F||0)?`Mario dedica solo il ${m.F}% a F`:'Mario non dedica tempo a F'}: è la leva sul gap più grande in valore (raccolta indiretta −4,37 mln, gestioni −15%, fondi −14%).`, 'ko');
  else if((m.F||0)>70)add(`Mario mette il ${m.F}% su F: giusta la priorità, ma 150 revisioni non entrano comunque in ${DM} giorni e restano scoperte H (amministrata −20%) e D (scadenza fiscale 31/12).`, 'warn');
  else add(`Mario su F al ${m.F}%: bene, è la leva sul gap più grande. Serve una scelta esplicita sui clienti da vedere prima (i maggiori per patrimonio): 150 revisioni non stanno in ${DM} giorni.`, 'ok');
  const mC=(m.A||0)+(m.C||0)+(m.G||0)+(m.B||0);
  if(mC>15)add(`Mario dedica il ${mC}% ad attività commerciali di base (A, B, C, G). È la risorsa più scarsa e più qualificata: quel tempo rende di più su attività tecniche.`, 'ko');
  const lT=(l.D||0)+(l.F||0)+(l.H||0);
  if(lT>20)add(`Luigi dedica il ${lT}% ad attività tecniche (D, F, H). Un supporto (fissare appuntamenti) va bene, la consulenza no.`, 'warn');
  const B=(m.B||0)+(l.B||0);
  if(B>10)add(`Obbligazioni su clienti esistenti (B) al ${B}% complessivo: rischiano di spostare denaro dalla raccolta a vista a quella a scadenza senza far crescere la diretta, e con tassi ai minimi il prodotto è poco attraente.`, 'warn');
  if(!(m.H||0)&&!(l.H||0))add('Nessun tempo su H: la raccolta amministrata è la voce in calo più forte (−1,97 mln, −20%).', 'ko');
  else if((m.H||0)===0)add('H è affidata solo a Luigi: presentare una piattaforma di trading è un\'attività tecnica, meglio Mario.', 'warn');
  if(!(m.D||0)&&!(l.D||0))add('Nessun tempo su D: i fondi pensione hanno una scadenza naturale (deducibilità entro il 31/12) e sono la voce che sta crescendo di più.', 'ko');
  if((l.A||0)<15)add(`Apertura conti (A) a ${l.A||0}% di Luigi: conti, carte e home banking sono gli indicatori più indietro sul percorso (8%, 13%, 23% contro il 67% atteso).`, 'ko');
  if((l.C||0)<15)add(`Obbligazioni su clienti nuovi (C) a ${l.C||0}% di Luigi: è l'attività che porta denaro nuovo alla diretta (−1,75 mln) e nuovi clienti.`, 'warn');
  if(!(l.E||0))add('Nessun tempo di Luigi sulle polizze vita XY (E): ne mancano 60 su 80, un gap da venditore con obiettivo mensile.', 'warn');
  if(!(l.G||0)&&!(m.G||0))add('Nessun tempo sulle polizze sanitarie (G): ne mancano 40 su 50. Si possono abbinare all\'apertura dei nuovi conti.', 'warn');
  const fi=fitIdx(m,l);
  if(fi.avg>=85)add(`Coerenza con i profili alta: Mario ${fi.mt}% su attività tecniche, Luigi ${fi.lc}% su attività commerciali.`, 'ok');
  return F;
}

   <p>· <b>Spalmare il tempo in parti uguali</b> "perché tutto è importante": vuol dire non scegliere. Vale circa 60 punti.</p>
   <h3>Per il debriefing</h3>
   <p>· Per Luigi ogni attività va tradotta in un numero mensile (≈35 conti, ≈10 polizze sanitarie, ≈15 polizze vita, appuntamenti da liste): è il ponte con l'esercitazione sugli obiettivi SMART.</p>
   <p>· Per Mario serve una scelta esplicita sui clienti da vedere prima: i 30-35 con il patrimonio maggiore.</p>
   <p>· Il caso non dà tutte le informazioni (gli impieghi non hanno un dato ad agosto e nessuna attività li riguarda): soluzioni diverse sono possibili, purché coerenti con persone e gap.</p>
  </div>`;
}

}
const PIN='strale';
function modal(h){$('modalBody').innerHTML=h;$('modal').classList.remove('hide')}

  modal(`<h2>Area formatore</h2><details class="guide" open><summary>Istruzioni passo passo (clicca per chiudere)</summary>
<p class="small">Codice formatore: <span class="pw">strale</span> (minuscolo o maiuscolo è uguale)</p>
<h4>Prima della sessione, su ogni notebook</h4><ol>
<li>Apri l'app (doppio clic su index.html oppure il link GitHub). Non usare la finestra privata del browser: i dati si perderebbero.</li>
<li>Se ci sono i dati di un team precedente: Formatore → <span class="pw">strale</span> → <b>Nuovo team (azzera)</b>.</li>

<li>Scheda 3: assegnano le % a Mario e Luigi (casella, + / − oppure cursore), scrivono le motivazioni e cliccano <b>Consegna</b> (si attiva solo quando ognuno somma 100%).</li>
<li>Scheda 4: vedono punteggio e commenti, poi cliccano <b>Scarica il file del team</b>: finisce nella cartella Download del notebook.</li>
<li>Ti passano quel file .json (chiavetta, email o AirDrop).</li></ol>
<h4>In plenaria, sul tuo notebook</h4><ol>

<li>Per proiettare la soluzione ottimale con le sue ragioni: Formatore → <b>Mostra la soluzione</b>. La colonna "Il vostro team" mostra i dati di quel notebook: aprila sul notebook di un team per il confronto diretto.</li>
<li>"← Torna all'app" in fondo alla pagina di confronto per tornare indietro.</li></ol>
<h4>Se qualcosa va storto</h4><ol>

<li>Cambio classe: prima fai scaricare il file del team, poi <b>Nuovo team (azzera)</b>.</li>

</details><details class="guide"><summary>Come vengono dati i punteggi (logica di valutazione)</summary>
<p><b>1. Punteggio della pianificazione (0-100).</b> Si basa su tre elementi.</p>
<ol>
<li><b>Peso dell'attività</b>, proporzionale al gap che riduce: <b>F 5</b> (raccolta indiretta −4,37 mln, gestioni −15%, fondi −14%) · <b>A 4</b> (conti, carte, home banking e clienti molto indietro, raccolta a vista) · <b>C 4</b> (denaro nuovo per la diretta −1,75 mln e nuovi clienti) · <b>D 3</b> (previdenza in crescita, scadenza fiscale 31/12) · <b>H 3</b> (amministrata −20%) · <b>E 2,5</b> (mancano 60 polizze vita XY su 80) · <b>G 2</b> (mancano 40 polizze sanitarie, valore basso) · <b>B 1</b> (sposta liquidità a vista sulle obbligazioni senza far crescere la diretta).</li>
<li><b>Efficacia della persona</b>: un giorno di Mario vale 1 sulle attività tecniche (D, F, H), 0,6 su E, 0,5 su B, 0,3-0,35 su A, C, G. Un giorno di Luigi vale 1 su A, C, G, 0,9 su E, 0,8 su B, 0,5 su D, 0,4 su H, 0,1 su F (profilatura e adeguatezza non sono il suo mestiere).</li>
<li><b>Rendimenti decrescenti</b>: ogni attività ha un numero di "giorni efficaci" che servono per coglierne gran parte del valore (F 22, A e C 14, E 10, D e G 8, H 7, B 6). I primi giorni rendono molto, i successivi sempre meno: concentrare tutto su una sola attività non conviene, spargere il tempo a caso nemmeno.</li>
</ol>
<p>Valore di un'attività = peso × (1 − e<sup>−giorni efficaci dedicati / giorni necessari</sup>). Si sommano le otto attività. L'app calcola la ripartizione migliore possibile (= 100) e la peggiore (= 0) e colloca il team in mezzo, con una curva che allarga le differenze in alto.</p>
<p>Riferimenti: soluzione ottimale 100 · tempo diviso in parti uguali 61 · tutto su un'attività per persona 30-50 · Mario e Luigi invertiti 25.<br>
Livelli: 90 e oltre eccellente · 75-89 buona · 60-74 discreta · sotto 60 da rivedere.</p>
<p><b>2. Coerenza con i profili (%).</b> Media tra la % del tempo di Mario sulle attività tecniche (D, F, H) e la % del tempo di Luigi sulle attività commerciali (A, B, C, E, G). È un indicatore informativo: non entra nel punteggio, che tiene già conto dell'efficacia delle persone.</p>
<p><b>3. Lettura dei gap (%).</b> Per ogni linea di risultato si confrontano le attività collegate dal team con la chiave. Ogni linea vale 1 punto: si prende la quota di attività attese trovate e si tolgono 0,25 punti per ogni attività non pertinente (minimo 0). Alcune attività sono "accettabili": non danno punti ma nemmeno li tolgono (es. C sulla raccolta a vista, F sulla raccolta a scadenza). Il risultato è la media delle 14 linee associabili (i totali raccolta diretta, indiretta e gestita sono esclusi).</p>
<p><b>4. Commenti automatici.</b> Sono regole fisse: Luigi su F → avviso competenza; Mario su F sotto 30% → leva principale sottoutilizzata, sopra 70% → H e D scoperte; Mario oltre 15% su A, B, C, G → spreco di competenza; Luigi oltre 20% su D, F, H → avviso; B oltre 10% → rischio cannibalizzazione; nessun tempo su H o D → gap scoperto; Luigi sotto 15% su A o C, zero su E → avviso; coerenza alta (85% o più) → commento positivo.</p>
<p class="small"><i>Pesi ed efficacie sono stime ragionate sui dati del caso, non dati del caso. Si possono cambiare nel codice (oggetto M).</i></p>

function tryPin(){if($('pin').value.trim().toLowerCase()===PIN){S.unlocked=true;save();openTrainer();renderNav()}else $('pinMsg').textContent='Codice errato.'}
const COL={A:'#c8693c',B:'#f0c5a3',C:'#8e3b1f',E:'#e0b341',G:'#d98aa0',D:'#1f5f6b',F:'#3f9aa6',H:'#9fd0cf'};
const ORD=['F','D','H','A','C','E','G','B'];
const SHORTN={A:'Nuovi conti',B:'Obblig. clienti esistenti',C:'Obblig. clienti nuovi',D:'Fondi pensione',E:'Polizze vita XY',F:'Profilatura e asset alloc.',G:'Polizze sanitarie',H:'Trading online'};
function legend(){return `<div class="lgd">${ORD.map(c=>`<span><i style="background:${COL[c]}"></i><b>${c}</b> ${SHORTN[c]} <em>${ACT.find(a=>a.c===c).ty==='T'?'T':'C'}</em></span>`).join('')}</div>`}
function lvlCol(s){return level(s)[1]}
function scoreChart(R){const W=760,rh=34,lw=170,H=R.length*rh+30,x=v=>lw+(W-lw-50)*v/100;
  let g=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Punteggi dei team">`;
  [0,25,50,75,100].forEach(v=>g+=`<line x1="${x(v)}" x2="${x(v)}" y1="0" y2="${H-22}" stroke="#e6e2d8"/><text x="${x(v)}" y="${H-6}" font-size="11" text-anchor="middle" fill="#5f6b75">${v}</text>`);
  R.forEach((r,i)=>{const y=i*rh+6,s=r.s,ref=r.ref;
    g+=`<text x="${lw-10}" y="${y+17}" font-size="14" text-anchor="end" fill="#1f2a33" font-weight="${ref?400:700}" font-style="${ref?'italic':'normal'}">${esc(r.n)}</text>
    <rect x="${lw}" y="${y}" width="${x(s)-lw}" height="24" rx="4" fill="${ref?'#cfd6d8':lvlCol(s)}"/>
    <text x="${x(s)+6}" y="${y+17}" font-size="14" font-weight="700" fill="#1f2a33">${s}</text>`});
  return g+'</svg>'}
function stackChart(R,who,days){const W=760,rh=30,lw=170,H=R.length*rh+28,x=v=>lw+(W-lw-20)*v/100;
  let g=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Tempo di ${who}">`;
  [0,25,50,75,100].forEach(v=>g+=`<text x="${x(v)}" y="${H-6}" font-size="11" text-anchor="middle" fill="#5f6b75">${v}%</text>`);
  R.forEach((r,i)=>{const y=i*rh+4,a=r[who];let cx=lw;
    g+=`<text x="${lw-10}" y="${y+16}" font-size="13" text-anchor="end" fill="#1f2a33" font-weight="${r.ref?400:700}" font-style="${r.ref?'italic':'normal'}">${esc(r.n)}</text>`;
    ORD.forEach(c=>{const v=a[c]||0;if(!v)return;const w=x(v)-lw;
      g+=`<rect x="${cx}" y="${y}" width="${w}" height="22" fill="${COL[c]}" stroke="#fff" stroke-width="1"><title>${c} ${SHORTN[c]}: ${v}% (${(days*v/100).toLocaleString('it-IT',{maximumFractionDigits:1})} gg)</title></rect>`;
      if(w>22)g+=`<text x="${cx+w/2}" y="${y+15}" font-size="11" text-anchor="middle" fill="${['B','H','E','G'].includes(c)?'#1f2a33':'#fff'}" font-weight="700">${c}</text>`;cx+=w});
  });return g+'</svg>'}
function donut(a,days,title){const R=62,r=38,cx=80,cy=80;let ang=-Math.PI/2,g=`<svg viewBox="0 0 160 160" class="donut" role="img" aria-label="${title}">`;
  const tot=CODES.reduce((s,c)=>s+(a[c]||0),0)||1;
  ORD.forEach(c=>{const v=a[c]||0;if(!v)return;const f=v/tot,a2=ang+f*2*Math.PI,lg=f>.5?1:0;
    const p=(R0,t)=>[cx+R0*Math.cos(t),cy+R0*Math.sin(t)];
    if(f>=.999){g+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" stroke="${COL[c]}" stroke-width="${R-r}"/>`}
    else{const [x1,y1]=p(R,ang),[x2,y2]=p(R,a2),[x3,y3]=p(r,a2),[x4,y4]=p(r,ang);
      g+=`<path d="M${x1},${y1}A${R},${R} 0 ${lg} 1 ${x2},${y2}L${x3},${y3}A${r},${r} 0 ${lg} 0 ${x4},${y4}Z" fill="${COL[c]}" stroke="#fff" stroke-width="1.5"><title>${c} ${SHORTN[c]}: ${v}%</title></path>`;
      if(f>.07){const [lx,ly]=p((R+r)/2,(ang+a2)/2);g+=`<text x="${lx}" y="${ly+4}" font-size="11" text-anchor="middle" font-weight="700" fill="${['B','H','E','G'].includes(c)?'#1f2a33':'#fff'}">${c}</text>`}}
    ang=a2});
  return g+`<text x="${cx}" y="${cy-2}" font-size="13" text-anchor="middle" font-weight="700" fill="#1f2a33">${title}</text><text x="${cx}" y="${cy+14}" font-size="11" text-anchor="middle" fill="#5f6b75">${days} giorni</text></svg>`}
function typeBar(a,ty){return CODES.filter(c=>ACT.find(x=>x.c===c).ty===ty).reduce((s,c)=>s+(a[c]||0),0)}

   <div class="row" style="align-items:baseline"><h2 style="margin:0">${i+1}° · ${esc(t.team)}</h2><span class="muted small">${esc(t.membri||'')}</span></div>
   <div class="tc-grid">
    <div class="tc-score"><div class="score-big" style="color:${col}">${s}</div><div style="color:${col};font-weight:700">${lv}</div>
      <div class="mini"><span>Coerenza profili</span><div class="bar"><i style="width:${fi.avg}%"></i></div><b>${fi.avg}%</b></div>
      <div class="mini"><span>Lettura dei gap</span><div class="bar"><i style="width:${t.mapPct||0}%"></i></div><b>${t.mapPct??'—'}%</b></div>
      <div class="mini"><span>Mario su attività tecniche</span><div class="bar"><i style="width:${fi.mt}%;background:#1f5f6b"></i></div><b>${fi.mt}%</b></div>
      <div class="mini"><span>Luigi su attività commerciali</span><div class="bar"><i style="width:${fi.lc}%;background:#c8693c"></i></div><b>${fi.lc}%</b></div></div>
    <div class="tc-pies">${donut(t.m,DM,'Mario')}${donut(t.l,DL,'Luigi')}</div>

   ${t.note?`<p><b>La loro lettura dei gap:</b> <i>${esc(t.note)}</i></p>`:''}
   <h3>Commenti</h3>${feedback(t.m,t.l).map(f=>`<div class="fb ${f.c}">${f.t}</div>`).join('')}
   ${ACT.some(a=>t.why&&t.why[a.c])?`<details class="why"><summary>Le loro motivazioni</summary>${ACT.filter(a=>t.why&&t.why[a.c]).map(a=>`<p class="small"><b>${a.c} ${SHORTN[a.c]}</b> (Mario ${t.m[a.c]||0}% · Luigi ${t.l[a.c]||0}%): ${esc(t.why[a.c])}</p>`).join('')}</details>`:''}

  <div class="card noprint"><button class="btn sec" onclick="go(0)">← Torna all'app</button></div>`;
}
